name: CI/CD Pipeline

on: 
  push:
    branches:
      - cleanup-branch
  pull_request:
    branches:
      - cleanup-branch

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLIENT_ID_WEB: ${{ secrets.GOOGLE_CLIENT_ID_WEB }}
      GOOGLE_CLIENT_ID_ANDROID: ${{ secrets.GOOGLE_CLIENT_ID_ANDROID }}
    steps:
      - uses: actions/checkout@v4
      - run: touch ./src/main/resources/application.properties
      - run: echo "${{secrets.APPLICATION}}" > ./src/main/resources/application.properties
      - uses: actions/upload-artifact@v4
        with:
          name: application.properties
          path: ./src/main/resources/application.properties

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create .env file for Flutter
        run: |
          echo "GOOGLE_CLIENT_ID_WEB=${{ secrets.GOOGLE_CLIENT_ID_WEB }}" >> .env
          echo "GOOGLE_CLIENT_ID_ANDROID=${{ secrets.GOOGLE_CLIENT_ID_ANDROID }}" >> .env

      - name: Set up environment
        run: |
          echo 'export PATH="$PATH:$HOME/flutter/bin"' >> $GITHUB_ENV
      - run: flutter pub get
      - run: flutter build web 

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x ./mvnw

      - name: Build and Test Spring demo
        run: ./mvnw clean install

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > GUNGANGAZI.pem
          chmod 600 GUNGANGAZI.pem

          # Flutter 웹 빌드 파일 배포
          scp -o StrictHostKeyChecking=no -i GUNGANGAZI.pem -r ./build/web/* ${{ secrets.EC2_DEPLOY_USER }}:/var/www/html/

          # Spring Boot JAR 파일 배포
          scp -o StrictHostKeyChecking=no -i GUNGANGAZI.pem ./target/demo-0.0.1-SNAPSHOT.jar ${{ secrets.EC2_DEPLOY_USER }}:/var/app/demo.jar

          # 원격 서버에서 Nginx 재시작 및 Spring Boot 실행
          ssh -o StrictHostKeyChecking=no -i GUNGANGAZI.pem ${{ secrets.EC2_DEPLOY_USER }} << EOF
          sudo systemctl restart nginx

          # 기존 jar 프로세스 종료
          pkill -f 'java.*demo.jar' || true

          # 새 jar 실행
          nohup java -jar /var/app/demo.jar > /dev/null 2>&1 &
          EOF

      - name: Cleanup
        run: rm -f GUNGANGAZI.pem
