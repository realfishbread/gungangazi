name: CI/CD Pipeline

on:
  push:
    branches:
      - cleanup-branch
  pull_request:
    branches:
      - cleanup-branch

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLIENT_ID_WEB: ${{ secrets.GOOGLE_CLIENT_ID_WEB }}
      GOOGLE_CLIENT_ID_ANDROID: ${{ secrets.GOOGLE_CLIENT_ID_ANDROID }}
    steps:
      - uses: actions/checkout@v4
      - run: touch ./src/main/resources/application.properties
      - run: echo "${{secrets.APPLICATION}}" > ./src/main/resources/application.properties

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create .env file for Flutter
        run: |
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" > .env
          echo "KAKAO_NATIVE_APP_KEY=${{ secrets.KAKAO_NATIVE_APP_KEY }}" >> .env
          echo "GOOGLE_CLIENT_ID_WEB=${{ secrets.GOOGLE_CLIENT_ID_WEB }}" >> .env
          echo "GOOGLE_CLIENT_ID_ANDROID=${{ secrets.GOOGLE_CLIENT_ID_ANDROID }}" >> .env

      - run: flutter pub get
      - run: flutter build web

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x ./mvnw

      - name: Build Spring Boot
        run: ./mvnw clean package -DskipTests

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: ./target/demo-0.0.1-SNAPSHOT.jar

      - name: Upload Flutter web artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: ./build/web/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: spring-boot-jar
          path: ./target/

      - name: Download Flutter web artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-web
          path: ./build/web/

      - name: Deploy to EC2
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > newGunganghazi.pem
          chmod 600 newGunganghazi.pem

          # Flutter 웹 빌드 파일 배포
          scp -o StrictHostKeyChecking=no -i newGunganghazi.pem -r ./build/web/* ${{ secrets.EC2_DEPLOY_USER }}:/var/www/html/

          # Spring Boot JAR 파일 배포
          scp -o StrictHostKeyChecking=no -i newGunganghazi.pem ./target/demo-0.0.1-SNAPSHOT.jar ${{ secrets.EC2_DEPLOY_USER }}:/var/app/demo.jar

          # 원격 서버에서 Nginx 재시작 및 Spring Boot 실행
          ssh -o StrictHostKeyChecking=no -i newGunganghazi.pem ${{ secrets.EC2_DEPLOY_USER }} << 'EOF'
          sudo systemctl restart nginx
          pkill -f 'java.*demo.jar' || true
          sleep 2
          nohup java -jar /var/app/demo.jar > /var/log/springboot.log 2>&1 &
          EOF

      - name: Cleanup
        run: rm -f newGunganghazi.pem
