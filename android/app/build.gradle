plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}



android {
    namespace = "com.example.example4"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    
    defaultConfig {
        applicationId = "com.example.example4"
        minSdk = 23
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders = [
            applicationName     : "io.flutter.app.FlutterApplication",
            KAKAO_NATIVE_APP_KEY: System.getenv("KAKAO_NATIVE_APP_KEY") ?: ""
        ]
    }
    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled false // R8 비활성화
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.6.0'
    
    // JSON 데이터 처리를 위한 Gson
    implementation 'com.google.code.gson:gson:2.8.8'

    // 네트워크 작업을 위한 OkHttp 라이브러리
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'

    // Retrofit: REST API와 RDS 연결이 필요할 때 사용 가능
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // Room: RDS와의 연결을 지원하는 로컬 데이터베이스 라이브러리 (옵션)
    implementation 'androidx.room:room-runtime:2.3.0'
    annotationProcessor 'androidx.room:room-compiler:2.3.0'

    // MySQL 연결을 위한 드라이버 (옵션)
    implementation 'mysql:mysql-connector-java:8.0.25'
    implementation 'com.kakao.sdk:v2-user:2.17.0'
}
