<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>건강하지?! 인증 코드</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .email-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            text-align: center;
        }
        h1 {
            color: #4CAF50;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            margin: 10px 0;
        }
        .code-box {
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
            margin: 20px 0;
            padding: 10px 20px;
            border: 2px dashed #4CAF50;
            display: inline-block;
            border-radius: 5px;
            background-color: #f9fff9;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
        }
        .footer a {
            color: #4CAF50;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <h1>안녕하세요, 건강하지입니다.</h1>
        <p>이메일 인증 요청을 받으셨습니다.</p>
        <p>아래 인증 코드를 입력하여 인증을 완료해주세요:</p>
        <div class="code-box" th:text="${code}">123456</div>
        <div class="footer">
            <p>이 요청을 본인이 하지 않았다면, 이 이메일을 무시하셔도 됩니다.</p>
        </div>
    </div>
</body>
</html>
